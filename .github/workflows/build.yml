name: Build module

# Every push to main (and manual runs) builds a KernelSU Next module ZIP from
# the pinned aox trees, uploads it as a workflow artifact and publishes it as
# a GitHub prerelease. Pull requests only build and test.
#
# The camera APK is signed with the public AOSP platform test key. Libraries
# collected from a phone (--native-cache) are not part of CI builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # publish releases

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q busybox clang lld llvm libc++-dev libc++abi-dev apksigner
          python3 -m pip install --quiet pytest unicorn

      - name: Cache pinned sources
        uses: actions/cache@v4
        with:
          path: .cache/aox
          key: sources-${{ hashFiles('aox/manifest.json', 'scripts/prepare_aox.py') }}

      - name: Fetch the pinned aox files and test fixtures
        run: python3 -I scripts/prepare_aox.py --fixtures

      - name: Build liboplus-uah-client
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          sh native/uah-client/build.sh .cache/aox/liboplus-uah-client.so

      - name: Shell checks
        run: |
          python3 -m pip install --quiet shellcheck-py
          for script in module/*.sh native/uah-client/build.sh; do busybox sh -n "$script"; done
          shellcheck -s sh -x module/aox.sh module/customize.sh module/post-fs-data.sh \
            module/mount-camera.sh native/uah-client/build.sh

      - name: Tests
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          python3 -m pytest -q tests

      - name: Build module
        run: |
          cd scripts
          python3 build.py --uah-client ../.cache/aox/liboplus-uah-client.so
          cd ..
          version=$(sed -n 's/^version=//p' module/module.prop)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=OplusCamera-OP9-$version-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          cat build/OplusCamera-OP9-*.zip.sha256

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: |
            build/OplusCamera-OP9-*.zip
            build/OplusCamera-OP9-*.zip.sha256
            !build/OplusCamera-OP9.zip
            !build/OplusCamera-OP9.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION-build$GITHUB_RUN_NUMBER"
          {
            echo "Automatic build of \`${GITHUB_SHA::7}\` ($(git log -1 --format=%s))."
            echo
            echo "OplusCamera 5.045.451 with the aox camera changes, built from the pinned"
            echo "aox trees. Install in KernelSU Next and reboot. On a ROM that already"
            echo "ships this camera (or a newer one) only the fixes are applied. Set"
            echo "App Profile → Oplus Camera → Umount modules OFF. What the installer"
            echo "decided is in /data/adb/modules/ooscamera_op9/aox.log."
            echo
            echo "SHA-256: \`$(cut -d ' ' -f 1 build/OplusCamera-OP9-$VERSION.zip.sha256)\`"
          } > release-notes.md
          gh release create "$tag" \
            "build/OplusCamera-OP9-$VERSION.zip" "build/OplusCamera-OP9-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" --title "Oplus Camera $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes-file release-notes.md --prerelease
